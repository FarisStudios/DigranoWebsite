<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a0c08">
<title>DiGrano | Links</title>

<meta property="og:description" content="DiGrano Pizzeria in Maadi, Cairo">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Varela+Round&display=swap" rel="stylesheet">

<style>
  :root{
    --mainred:#7a0c08;
    --deepred:#4a0704;
    --accentyellow:#e89c1e;
    --white:#ffffff;
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  html,body{min-height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, var(--mainred) 0%, var(--deepred) 100%) fixed;
    background-color:var(--mainred);
    font-family:"Varela Round",Arial,sans-serif;
    color:var(--white);
    -webkit-font-smoothing:antialiased;
  }

  /* Full-width shell: strip / content / footer / strip */
  .shell{width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  .strip{width:100%;line-height:0;overflow:hidden;flex:none}
  .strip img{width:100%;height:auto;display:block}
  .strip .fb{
    display:none;width:100%;height:24px;
    background:conic-gradient(var(--mainred) 25%,#fff 0 50%,var(--mainred) 0 75%,#fff 0) 0 0/24px 24px;
  }

  main{flex:1;width:100%;display:flex;justify-content:center;padding:44px 20px 40px}
  .content{width:100%;max-width:440px;text-align:center}

  .logo{width:230px;max-width:70%;height:auto;display:block;margin:0 auto}
  .logo-text{display:none;font-family:"Playfair Display",serif;font-style:italic;font-weight:700;font-size:44px;color:var(--accentyellow)}

  .tag{
    margin:22px auto 0;
    font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;
    font-size:20px;line-height:1.35;color:var(--white);
  }
  .sub{margin-top:8px;font-size:14px;color:#f3d9d6}

  nav{margin-top:34px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

  .btn{
    display:flex;align-items:center;gap:14px;
    min-height:96px;padding:14px 12px;flex-direction:column;justify-content:center;gap:8px;
    border-radius:12px;
    background:var(--white);color:var(--mainred);
    text-decoration:none;
    font-family:"Varela Round",sans-serif;font-size:18px;line-height:1.2;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn .ico{
    width:36px;height:36px;border-radius:50%;flex:none;
    background:var(--mainred);color:var(--white);
    display:flex;align-items:center;justify-content:center;
    transition:background-color .15s, color .15s;
  }
  .btn .ico svg{width:20px;height:20px}
  .btn .label{flex:1;text-align:center}
  .btn .go{display:none}

  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);outline:none;
    background:var(--accentyellow);border-color:var(--accentyellow);color:var(--deepred);
  }
  .btn:hover .ico,.btn:focus-visible .ico{background:var(--deepred)}
  .btn:active{transform:translateY(0)}

  .btn.primary,.btn.review{
    grid-column:1 / -1;min-height:60px;padding:0 18px 0 12px;
    flex-direction:row;gap:14px;
  }
  .btn.primary .label,.btn.review .label{text-align:left}
  .btn.primary .go,.btn.review .go{display:block;width:22px;height:22px;opacity:.6;flex:none}

  .btn.primary{
    background:var(--accentyellow);border-color:var(--accentyellow);color:var(--deepred);
    min-height:68px;font-size:20px;box-shadow:0 6px 18px rgba(232,156,30,.32);margin-bottom:12px;
  }
  .btn.primary .ico{background:var(--deepred);color:var(--accentyellow)}
  .btn.primary:hover,.btn.primary:focus-visible{background:var(--white);border-color:var(--white);color:var(--mainred)}
  .btn.primary:hover .ico,.btn.primary:focus-visible .ico{background:var(--mainred);color:var(--white)}

  .btn.social{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.social .ico{background:rgba(255,255,255,.2);color:#fff}
  .btn.social:hover,.btn.social:focus-visible{background:var(--brand);border-color:var(--brand);color:#fff;filter:brightness(.88)}
  .btn.social:hover .ico,.btn.social:focus-visible .ico{background:rgba(255,255,255,.3)}
  .btn.instagram{--brand:linear-gradient(135deg,#833ab4 0%,#fd1d1d 55%,#fcb045 100%)}
  .btn.facebook{--brand:#0866ff}
  .btn.tiktok{--brand:#111}
  .btn.instapay{--brand:#633a8f}

  .info{margin-top:34px;font-size:14px;line-height:1.7;color:#f3d9d6}
  .info b{font-weight:400;color:var(--accentyellow)}

  footer{
    width:100%;flex:none;background:none;text-align:center;
    font-size:13px;color:#e8c9c5;padding:16px 20px;
  }

  /* Phones */
  @media (max-width:480px){
    main{padding:32px 16px 32px}
    .logo{width:200px}
    .tag{font-size:18px;margin-top:18px}
    nav{margin-top:28px}
    .btn{min-height:92px;font-size:16px}
    .btn.primary,.btn.review{min-height:58px;font-size:17px}
    .btn.primary{min-height:64px;font-size:19px}
    .info{margin-top:28px}
  }
  @media (max-width:340px){
    .btn{gap:8px;padding:12px 8px;font-size:14px}
    .btn.primary,.btn.review{gap:10px;padding:0 12px 0 10px;font-size:16px}
  }
  /* No hover-lift on touch screens */
  @media (hover:none){
    .btn:hover{transform:none}
  }
  @media (prefers-reduced-motion:reduce){
    .btn,.btn .ico{transition:none}
  }
</style>
</head>
<body>

  <footer>© 2025 DiGrano. All rights reserved</footer>

  <!-- Bottom checkers: last element on the page, full width -->

    <img style="background: #ffffff;" src="special-images\Checkers.svg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
